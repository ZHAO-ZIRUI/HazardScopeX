# THIS IS A TEMPLATE CONFIG FILE
# YOU SHOULD COPY THIS FILE AND RENAME IT TO config.yaml
# 该文件是配置文件的模板, 你应当复制该文件并重命名为 config.yaml, 并编辑该文件以满足你的需求

# 日志配置
logging:
  # 日志级别
  # 可选: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: DEBUG

# CarlaContext 配置
context:
  # CARLA 服务端的配置
  server:
    host: 127.0.0.1 # 除非使用外部服务器, 否则不要修改该值
    port: 2000
    timeout: 1

    # 服务端同步模式的速度, 单位: FPS
    # 该同步模式的设置方式与以往不同, 在服务端启动时指定, 且不需再由 world.settings 指定
    sync_mode_fps: 20
    
    # 是否使用外部服务器,
    # 如果为 true, 则 CarlaContext 不再管理 CARLA 服务端的生命周期, 且以下配置将会失效
    use_external_server: false

    # 注意: 本工程使用了 CARLA 的 MULTI_GPU 功能
    # 参考: https://carla.readthedocs.io/en/latest/adv_multigpu/
    
    # 服务端的可执行文件路径
    # 在 Windows 下, 该路径需要以 .exe 结尾
    # 在 Linux 下, 该路径需要以 .sh 结尾
    exe_path: ""

    # 使用多 GPU 功能
    use_multi_gpu: false
    gpus:
      - 0

    # 服务端启动时的等待时间
    server_start_wait_time: 2
    server_start_timeout: 10

  # Actor 管理器配置
  actors:
    # Actor 生成后稳定阈值
    spawn_stable_threshold: 0.0001
    # Actor 生成后稳定超时时间
    spawn_stable_timeout: 3
# THIS IS A TEMPLATE CONFIG FILE
# YOU SHOULD COPY THIS FILE AND RENAME IT TO config.yaml
# 该文件是配置文件的模板, 你应当复制该文件并重命名为 config.yaml, 并编辑该文件以满足你的需求

# CarlaContext 配置
context:
  # CARLA 服务端的配置
  server:
    host: localhost
    port: 2000
    timeout: 10
    
    # 是否使用外部服务器,
    # 如果为 true, 则 CarlaContext 不再管理 CARLA 服务端的生命周期, 且部分功能将不可用
    use_external_server: false

    # 注意: 如果 use_external_server 为 true, 则以下配置将会被忽略
    # 是否显示服务端窗口
    reander_offsceen: false
    
    # 服务端的可执行文件路径
    # 在 Windows 下, 该路径需要以 .exe 结尾
    # 在 Linux 下, 该路径需要以 .sh 结尾
    server_exe_path: ""

[project]
name = "hazard-scope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, !=3.11.*, <3.13"
dependencies = [
    "carla>=0.9.16",
    "em>=0.4.0",
    "lark>=1.3.0",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "opencv-python>=4.11.0.86",
    "psutil>=7.1.3",
    "pydantic>=2.12.5",
    "pygame>=2.6.1",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "typing-extensions>=4.15.0",
    "pyquaternion==0.9.9",
    "ultralytics>=8.4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "coverage>=7.12.0",
]

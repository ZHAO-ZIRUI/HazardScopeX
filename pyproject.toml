[project]
name = "root"
version = "0.0.0"
requires-python = "==3.10.*" # Fit CARLA 0.9.15 Python version requirements.
dependencies = [
    "carla>=0.9.15",
    "core",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "psutil>=7.0.0",
    "rich>=14.1.0",
    "typing-extensions>=4.15.0",
    "uv-build>=0.8.14",
]

[tool.uv]
package = false  # Virtual package

[tool.uv.workspace]
members = [
  "core",
  "apps/server",
  "apps/client",
  "apps/demo_external_keyboard_control"
]

[tool.uv.sources]
core = { workspace = true }

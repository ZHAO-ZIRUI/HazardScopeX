[project]
name = "hazard-scope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "carla>=0.9.16",
    "em>=0.4.0",
    "lark>=1.3.0",
    "numpy>=2.2.6",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "typing-extensions>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.hatch.metadata]
allow-direct-references = true
